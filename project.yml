name: GooglyEyes
options:
  bundleIdPrefix: com.example.blueywin
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GooglyEyes:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.blueywin.phone
        PRODUCT_NAME: Bluey
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Bluey
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Bluey finds the Windows PC app on your Wi-Fi so the character can look where it points.
        NSMicrophoneUsageDescription: Hold the screen and talk to your blueberry. Your voice goes to your own PC.
        NSBonjourServices:
          - _googly._tcp
        UIAppFonts:
          - Fredoka.ttf
          - IBMPlexSans.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
